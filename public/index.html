<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Week 2 API</title>
    <style>
      body {
        font-family: sans-serif;
        background: #888881;
        color: #e2e8f0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .card {
        background: #1e293b;
        padding: 40px;
        border-radius: 16px;
        text-align: center;
        max-width: 500px;
      }

      h1 { color: #38bdf8; margin-bottom: 12px; }
      p  { color: #94a3b8; margin-bottom: 24px; }

      .route {
        background: #0f172a;
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 10px;
        text-align: left;
        font-family: monospace;
      }

      .get  { color: #38bdf8; }
      .post { color: #4ade80; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>My Week 2 API!</h1>
      <p>Built with Node.js + Express</p>

      <div class="route"><span class="get">GET</span>    /</div>
      <div class="route"><span class="post">POST</span>  /user</div>
      <div class="route"><span class="get">GET</span>    /user/:id</div>
    </div>
  </body>
</html>
